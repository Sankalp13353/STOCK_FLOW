name: StockFlow Controlled Release & Render Deployment

# ==============================================================================
# STOCKFLOW CI/CD ARCHITECTURE & RENDER DEPLOYMENT:
# ------------------------------------------------------------------------------
# 1. Controlled manual trigger requiring explicit operator dispatch and review.
# 2. Database migrations run atomically via Render's native `preDeployCommand`
#    configured on `stockflow-api` in `render.yaml` (`npx prisma migrate deploy`).
#    If migrations fail, Render immediately halts deployment and leaves the
#    previous healthy containers active, eliminating the need for duplicate
#    migration execution in GitHub Actions.
# 3. Deployment target is locked to 'production' until an isolated staging
#    database branch is provisioned on Neon.
# 4. Ordered deployment trigger via Render Deploy Hooks:
#    - Step 1: Trigger API (`stockflow-api`) deploy hook.
#              Render builds Dockerfile, runs `preDeployCommand` (Prisma migration),
#              and verifies `/health` before routing traffic.
#    - Step 2: Trigger Worker (`stockflow-worker`) deploy hook.
#              Render builds and starts the background worker process.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target Deployment Environment (locked to production; staging disabled until isolated database exists)'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Trigger Render Service Deployment
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.deploy_target }}

    steps:
      - name: Validate Target Environment
        run: |
          if [ "${{ github.event.inputs.deploy_target }}" != "production" ]; then
            echo "::error::Deployment target '${{ github.event.inputs.deploy_target }}' is not permitted. Only 'production' is currently active."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Render Deploy Hook Secrets
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK" ]; then
            echo "::error::Missing required secret: secrets.RENDER_API_DEPLOY_HOOK. Please configure this secret in GitHub Environment '${{ github.event.inputs.deploy_target }}'."
            exit 1
          fi
          if [ -z "$RENDER_WORKER_DEPLOY_HOOK" ]; then
            echo "::error::Missing required secret: secrets.RENDER_WORKER_DEPLOY_HOOK. Please configure this secret in GitHub Environment '${{ github.event.inputs.deploy_target }}'."
            exit 1
          fi
          echo "Render deployment hook secrets verified."

      - name: Trigger stockflow-api Deployment (includes preDeployCommand migrations)
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          echo "Triggering deployment for stockflow-api..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_API_DEPLOY_HOOK")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "::error::Failed to trigger stockflow-api deployment (HTTP $HTTP_STATUS): $BODY"
            exit 1
          fi
          echo "Successfully queued deployment for stockflow-api. Render is executing preDeployCommand (Prisma migrations) followed by container healthcheck."

      - name: Trigger stockflow-worker Deployment
        env:
          RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
        run: |
          echo "Triggering deployment for stockflow-worker..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_WORKER_DEPLOY_HOOK")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "::error::Failed to trigger stockflow-worker deployment (HTTP $HTTP_STATUS): $BODY"
            exit 1
          fi
          echo "Successfully queued deployment for stockflow-worker."
