services:
  # ---------------------------------------------------------------------------
  # Web Service: stockflow-api (Render Free Web Service — ₹0 Budget)
  # ---------------------------------------------------------------------------
  # Free tier configuration:
  # - plan: free (0.1 CPU, 512 MB RAM, $0/month)
  # - preDeployCommand is a paid-only feature and is omitted (migrations applied via CI or CLI)
  # - Spins down after 15 minutes of inactivity; spins up automatically on inbound HTTP requests
  # - Background workers, RabbitMQ, and Redis are omitted from cloud deployment to maintain ₹0 cost
  # - Complete distributed architecture (workers, Redis, RabbitMQ) runs locally via Docker Compose
  # ---------------------------------------------------------------------------
  - type: web
    name: stockflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
